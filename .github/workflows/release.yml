# Издание при етикет: „git tag v1.3.0 && git push origin v1.3.0“.
#
# Прави същото като tools\release.ps1 на ръка: проверки, сглобяване, пакет на
# Velopack с бележките от CHANGELOG.md и качване под „Releases“ на хранилището
# (виж UpdateFeed.cs). Етикет с тире — „v1.4.0-beta.1“ — излиза като пробно
# издание и стига само до тези, които са го поискали в „Настройки“.
#
# Докато кодът и изданията са в едно хранилище, стига вграденият GITHUB_TOKEN
# (правото „contents: write“ отдолу). Ако изданията минат в отделно хранилище,
# тук идва тайна с ключ за него — виж docs\КЪМ_GITHUB.md.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Проверки
        run: |
          dotnet build --nologo -c Release
          dotnet run --project tests/RiosvImports.Tests -c Release --no-build

      # Номерът на vpk следва пакета Velopack в RiosvImports.App.csproj.
      - name: Velopack
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 0.0.1298
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Издание
        shell: pwsh
        env:
          RELEASES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./tools/release.ps1 -Version $version -Upload
